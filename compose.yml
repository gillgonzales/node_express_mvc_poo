name: node_express_mvc_poo
services:
  app:
    build: .
    container_name: node_mvc_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    environment:
      NODE_ENV: development
      PORT: 3000
      SESSION_SECRET: ${SESSION_SECRET:-development-secret}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-app_db}
      DB_USER: ${DB_USER:-app_user}
      DB_PASSWORD: ${DB_PASSWORD:-app_password}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [mvc-network]
  postgres:
    image: postgres:16-alpine
    container_name: node_mvc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-app_db}
      POSTGRES_USER: ${DB_USER:-app_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app_password}
    ports: ["${DB_FORWARD_PORT:-55432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [mvc-network]
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: node_mvc_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
    ports: ["${PGADMIN_PORT:-18080}:80"]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [mvc-network]
volumes:
  postgres_data:
networks:
  mvc-network:
    driver: bridge